name: release
# 手动触发（workflow_dispatch）构建安装包并保存到 Actions artifacts：
#   macos-latest → .dmg（aarch64）
#   windows-latest → .exe（NSIS x64）
#   ubuntu-latest → .apk（Android arm64，勾 android 输入；见 jobs.android）
#
# **本仓是 smartThise/OneTHU 的临时分叉，刻意不监听 tag**（2026-10-23）：
# 分叉里打 `v*` 会与上游将来的同名 tag 撞车，也会让 Actions 产出一套看着像正式发布的东西。
# 要出包一律在这里手动 dispatch；分叉包请勾 `fork`（见 inputs.fork）。
on:
  workflow_dispatch:
    inputs:
      only_windows:
        description: "只跑 Windows job（日常验证 Windows 构建链用）"
        type: boolean
        default: false
      runner:
        description: "构建机：github-hosted（云，约 11 分钟）/ self-hosted（自己的 Windows 机，热缓存 1–3 分钟）"
        type: choice
        options: ["github-hosted", "self-hosted"]
        default: "github-hosted"
      no_bundle:
        description: "只出便携 exe（跳过 NSIS 安装包，迭代更快）"
        type: boolean
        default: false
      fork:
        description: "按分叉包构建：独立打包标识与版本、更新源指向本 fork（apps/desktop/scripts/build-fork.mjs）"
        type: boolean
        default: false
      android:
        description: "同时构建 Android 分叉包（包名 app.onethu.desktop.fork，签名读 ANDROID_* secret）"
        type: boolean
        default: false

jobs:
  desktop:
    # 手动触发可只跑 Windows（矩阵动态生成）；不分叉时恒为双平台
    strategy:
      fail-fast: false
      matrix: ${{ (github.event_name == 'workflow_dispatch' && inputs.only_windows)
        && fromJSON('{"include":[{"os":"windows-latest","args":""}]}')
        || fromJSON('{"include":[{"os":"macos-latest","args":"--target aarch64-apple-darwin"},{"os":"windows-latest","args":""}]}') }}
    # 自建 runner（自己的 Windows 机）：热 target 目录增量编译，比云上快一个数量级。
    # 标签用 [self-hosted, Windows]（GitHub 给自建 runner 的默认标签）。
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted')
      && fromJSON('["self-hosted","Windows"]') || matrix.os }}
    # 默认 shell 在 Windows runner 上是 pwsh：多行 run 里前面的命令失败不会中断，
    # step 的退出码只看最后一条命令。实测 run 39979127330：鉴权守卫在 Windows 上
    # 同样断言失败，step 却是绿的，只有 macOS（bash）报红。统一走 bash，三端一致。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # 自建 runner 不 clean：保住 target/ 与 node_modules 的热缓存（clean 会 git clean -ffdx）
          clean: ${{ !(github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # sccache：跨运行的编译结果缓存（Windows 上依赖编译是主要开销）
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: swatinem/rust-cache@v2
        with:
          # sidecar 是独立 cargo 工程（target 在自己目录下），不列出则每轮
          # 冷编整个依赖树——Windows runner 实测白烧 5–8 分钟
          workspaces: |
            apps/desktop/src-tauri
            plugins/OneTHU-Harness
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      # 工作区库里 main 指向 dist 的必须先构建（dist 不入库）：
      #   Windows/macOS 的 tauri build 在 beforeBuildCommand 阶段会因
      #   「Failed to resolve entry for package "@onethu/info-lib"」直接失败
      #   （2026-09-21 windows-latest 实录）。本机不复发是因为 dist 已存在。
      # 规则：任一 packages/* 的 package.json main 指向 dist 时，都要加进这一行。
      - name: Build workspace libraries
        run: pnpm --filter @onethu/info-lib build
      - name: Check Windows WebView threading
        run: node tools/windows-webview-threading-test.mjs
      - name: Check desktop window ownership
        run: node tools/desktop-lifecycle-policy-test.mjs
      - name: Check background keep-alive carriers
        run: node --import ./tools/ts-resolve-register.mjs tools/desktop-keepalive-test.mjs
      - name: Check fork build isolation
        run: node tools/fork-build-test.mjs
      - name: Check cloud account boundaries
        run: node tools/seafile-account-lifecycle-test.mjs
      - name: Check authentication recovery and account ownership
        # 走 package.json 的 test:login 而不是在这里铺多行命令：一条命令只有一退出码，
        # 各平台语义一致，本地也能用同一条脚本复现（`pnpm run test:login`）。
        run: pnpm run test:login
      - name: Check profile merge boundaries
        run: node --import ./tools/ts-resolve-register.mjs tools/profile-sync-test.mjs
      - name: Check secondary timetable and calendar integrity
        run: |
          node tools/secondary-schedule-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/secondary-anchor-test.mjs
          node tools/system-calendar-state-test.mjs
      - name: Check learning sessions and portable wallpaper archives
        run: |
          node --import ./tools/ts-resolve-register.mjs tools/http-wengine-bootstrap-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/learn-response-recovery-test.mjs
          node tools/wallpaper-sync-test.mjs
          node tools/personal-cloud-target-state-test.mjs
      - name: Check update reminders and news language
        run: |
          node tools/update-reminder-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/update-language-test.mjs
          node tools/update-check-lifecycle-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/news-language-test.mjs
      - name: Check mobile interaction state
        run: |
          node --import ./tools/ts-resolve-register.mjs tools/mobile-layout-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/preview-data-isolation-test.mjs
          node tools/update-check-lifecycle-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/board-undo-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/vault-docking-test.mjs
      # sidecar 必须在目标平台现场构建（仓库不带任何架构的二进制；
      # 旧版 Windows 安装包曾打进 mac 的 Mach-O → 插件宿主拉起必死）
      - name: Build harness sidecar (host-native)
        run: pnpm --filter @onethu/desktop build:harness
      - name: Build desktop bundles
        # 分叉包走 scripts/build-fork.mjs（换打包标识与版本、更新源指向本 fork、产物自校验）；
        # 不分叉时仍是原来的 tauri build。
        run: ${{ inputs.fork && 'node apps/desktop/scripts/build-fork.mjs' || 'pnpm --filter @onethu/desktop exec tauri build' }} ${{ matrix.args }} ${{ (github.event_name == 'workflow_dispatch' && inputs.no_bundle) && '--no-bundle' || '' }}
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ""
          TRACE_AMAP_KEY: ${{ secrets.TRACE_AMAP_KEY }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onethu-${{ matrix.os }}${{ inputs.fork && '-fork' || '' }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/onethu.exe
            apps/desktop/src-tauri/target/release/OneTHU-Fork.exe
            apps/desktop/src-tauri/target/**/*.dmg

  android:
    # 分叉包的 Android 产物：applicationId 换成 app.onethu.desktop.fork，与正式版并存、
    # 互不覆盖（同包名换签名会 INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
    # 打包链路在 apps/desktop/scripts/build-fork-apk.sh：Linux runner 上从零生成工程，
    # 不复用 build-release-apk.sh 那套 exFAT 内盘搬迁逻辑（CI 上没有那个问题）。
    # 签名材料由 secret 落盘到临时目录；**没配 secret 时只出未签名包**（文件名带
    # -unsigned），用于验证构建链，不会被误当成可发布产物。
    if: github.event_name == 'workflow_dispatch' && inputs.android
    runs-on: ubuntu-latest
    env:
      # NDK 只提供 clang/sysroot（rquickjs 的 bindgen 与链接器要用），AGP 不校验具体版本
      # （生成的工程没有 ndkVersion）。换版本只改这一行，脚本按 NDK_HOME 自行推导工具链路径。
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # 语法错要在下载 SDK/NDK 之前就炸，别等十分钟
      - name: Check shell syntax
        run: bash -n apps/desktop/scripts/build-fork-apk.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 生成的工程是 AGP 8.11 + Gradle 8.14.3：JDK 17 是 AGP 8.x 的下限
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # 默认值 `tools platform-tools` 里的 `tools` 已从 SDK 仓库移除：sdkmanager 报
          # `Warning: Failed to find package 'tools'` 后退出 1，step 直接失败（实测 run
          # 39962500491）。留空，由下一步用显式包名安装。
          packages: ""
      - name: Install SDK packages and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;$NDK_VERSION"
          ls -1 "$ANDROID_HOME/ndk"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            plugins/OneTHU-Harness
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build workspace libraries
        run: pnpm --filter @onethu/info-lib build
      - name: Check fork build isolation
        run: node tools/fork-build-test.mjs
      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::仓库未配置 ANDROID_KEYSTORE_BASE64：本次只产出未签名 APK（仅验证构建链）"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/onethu-release.keystore"
          chmod 600 "$RUNNER_TEMP/onethu-release.keystore"
          echo "ONETHU_KEYSTORE=$RUNNER_TEMP/onethu-release.keystore" >> "$GITHUB_ENV"
      - name: Build fork APK
        env:
          ONETHU_APK_OUT: ${{ runner.temp }}/apk
          ONETHU_KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          ONETHU_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ONETHU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: bash apps/desktop/scripts/build-fork-apk.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onethu-android-fork
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
