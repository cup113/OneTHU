name: release
# 手动触发（workflow_dispatch）构建安装包并保存到 Actions artifacts：
#   macos-latest → .dmg（aarch64）
#   windows-latest → .exe（NSIS x64）
#   ubuntu-latest → .apk（Android arm64，勾 android 输入；见 jobs.android）
#
# **本仓是 smartThise/OneTHU 的临时分叉，刻意不监听 tag**（2026-10-23）：
# 分叉里打 `v*` 会与上游将来的同名 tag 撞车，也会让 Actions 产出一套看着像正式发布的东西。
# 要出包一律在这里手动 dispatch；分叉包请勾 `fork`（见 inputs.fork）。
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "可选：构建已冻结的源码 ref（用于打包流程修复）"
        type: string
        required: false
        default: ""
      only_windows:
        description: "只跑 Windows job（日常验证 Windows 构建链用）"
        type: boolean
        default: false
      runner:
        description: "构建机：github-hosted（云，约 11 分钟）/ self-hosted（自己的 Windows 机，热缓存 1–3 分钟）"
        type: choice
        options: ["github-hosted", "self-hosted"]
        default: "github-hosted"
      no_bundle:
        description: "只出便携 exe（跳过 NSIS 安装包，迭代更快）"
        type: boolean
        default: false
      fork:
        description: "按分叉包构建：独立打包标识与版本、更新源指向本 fork（apps/desktop/scripts/build-fork.mjs）"
        type: boolean
        default: false
      android:
        description: "同时构建 Android 分叉包（包名 app.onethu.desktop.fork，签名读 ANDROID_* secret）"
        type: boolean
        default: false
      version:
        description: "分叉版本覆盖（形如 0.11.3-2，留空用 tauri.fork.conf.json）。带 release 时必填"
        type: string
        default: ""
      release:
        description: "构建后发布 GitHub Release：tag 为 fork-<version>，附三端产物与 latest.json（需同时勾 fork 与 android）"
        type: boolean
        default: false

jobs:
  guard:
    # 输入组合在开始时校验：等三个 job 跑完才发现「release 没勾 android」是最贵的失败方式
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          # 分叉仓库的 GITHUB_TOKEN 只读：配了 PAT 就用它，否则回落到只读 token（写权限校验会当场拦下）
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE: ${{ inputs.release }}
          FORK: ${{ inputs.fork }}
          ANDROID: ${{ inputs.android }}
          ONLY_WINDOWS: ${{ inputs.only_windows }}
          RUNNER: ${{ inputs.runner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION" ] && ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
            echo "::error::version 必须形如 <主>.<次>.<补丁>-<纯数字>（如 0.11.3-2），当前是 $VERSION"
            exit 1
          fi
          if [ "$RELEASE" = "true" ]; then
            [ "$FORK" = "true" ] || { echo "::error::release 需要同时勾 fork"; exit 1; }
            [ "$ANDROID" = "true" ] || { echo "::error::release 需要同时勾 android（清单要求三端齐全）"; exit 1; }
            [ -n "$VERSION" ] || { echo "::error::release 需要显式给 version"; exit 1; }
            # 三端齐全才谈发布：只跑 Windows、或只跑自建 Windows 机，都凑不出 macOS 产物
            [ "$ONLY_WINDOWS" != "true" ] || { echo "::error::release 不能勾 only_windows（缺 macOS 产物，清单会拒绝生成）"; exit 1; }
            [ "$RUNNER" != "self-hosted" ] || { echo "::error::release 需要 github-hosted runner（自建机只有 Windows，凑不出三端）"; exit 1; }
            # tag 查重走 gh api：guard job 没有 checkout，没有 origin 远端，
            # `git ls-remote` 只会以 128 失败，`if` 判假就静默放过了（实测 run 40054912059 就是
            # 这样放过去、到 publish 才报「tag 已存在」）。这里只有 404 才算「不存在」，
            # 其它任何失败都必须让 guard 红，不允许把「查不了」当成「没有」。
            set +e
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/fork-$VERSION" --jq .ref 2>&1)"
            queried=$?
            set -e
            if [ "$queried" -eq 0 ]; then
              echo "::error::tag ${existing:-fork-$VERSION} 已存在：改版本号，或先删掉旧 Release（覆盖会让已下载的客户端清单与产物不一致）"
              exit 1
            fi
            case "$existing" in
              *"Not Found"*|*404*) : ;;
              *) echo "::error::tag 查重失败，不能据此发布：$existing"; exit 1 ;;
            esac
            # 写权限自检：`.permissions.push` 不可用（探针实测：能建 Release 的 token 上它也是
            # false），只能真做一次动作。建一个 draft 再立刻删：draft 不进 Releases 列表，
            # 也不影响 `releases/latest`。失败就当场红，别等三端编完才在 publish 报 403。
            probe_tag="probe-perm-${GITHUB_RUN_ID}"
            if probe_id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$probe_tag" -f target_commitish="$GITHUB_SHA" -F draft=true --jq .id 2>&1)"; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$probe_id" >/dev/null 2>&1 || true
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$probe_tag" >/dev/null 2>&1 || true
              echo "· 写权限自检通过（draft release 建删各一次，tag=$probe_tag）"
            else
              echo "::error::当前 token 建不了 Release：$probe_id（检查仓库 Workflow permissions，或配置 secrets.RELEASE_TOKEN）"
              exit 1
            fi
          fi
          echo "· 输入校验通过（fork=$FORK android=$ANDROID release=$RELEASE version=${VERSION:-<配置里的版本>}）"

  desktop:
    needs: guard
    # 手动触发可只跑 Windows（矩阵动态生成）；不分叉时恒为双平台
    strategy:
      fail-fast: false
      matrix: ${{ (github.event_name == 'workflow_dispatch' && inputs.only_windows)
        && fromJSON('{"include":[{"os":"windows-latest","args":""}]}')
        || fromJSON('{"include":[{"os":"macos-latest","args":"--target aarch64-apple-darwin"},{"os":"windows-latest","args":""}]}') }}
    # 自建 runner（自己的 Windows 机）：热 target 目录增量编译，比云上快一个数量级。
    # 标签用 [self-hosted, Windows]（GitHub 给自建 runner 的默认标签）。
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted')
      && fromJSON('["self-hosted","Windows"]') || matrix.os }}
    # 默认 shell 在 Windows runner 上是 pwsh：多行 run 里前面的命令失败不会中断，
    # step 的退出码只看最后一条命令。实测 run 39979127330：鉴权守卫在 Windows 上
    # 同样断言失败，step 却是绿的，只有 macOS（bash）报红。统一走 bash，三端一致。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          submodules: recursive
          # 自建 runner 不 clean：保住 target/ 与 node_modules 的热缓存（clean 会 git clean -ffdx）
          clean: ${{ !(github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted') }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # sccache：跨运行的编译结果缓存（Windows 上依赖编译是主要开销）
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: swatinem/rust-cache@v2
        with:
          # sidecar 是独立 cargo 工程（target 在自己目录下），不列出则每轮
          # 冷编整个依赖树——Windows runner 实测白烧 5–8 分钟
          workspaces: |
            apps/desktop/src-tauri
            plugins/OneTHU-Harness
      - uses: android-actions/setup-android@v3
        if: runner.os == 'Linux'
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      # 工作区库里 main 指向 dist 的必须先构建（dist 不入库）：
      #   Windows/macOS 的 tauri build 在 beforeBuildCommand 阶段会因
      #   「Failed to resolve entry for package "@onethu/info-lib"」直接失败
      #   （2026-09-21 windows-latest 实录）。本机不复发是因为 dist 已存在。
      # 规则：任一 packages/* 的 package.json main 指向 dist 时，都要加进这一行。
      - name: Build workspace libraries
        run: pnpm --filter @onethu/info-lib build
      - name: Build resident CLI
        run: pnpm --filter @onethu/cli build
      - name: Check Windows private session storage
        if: runner.os == 'Windows'
        timeout-minutes: 2
        run: node --import tsx tools/windows-session-storage-test.mjs
      - name: Check resident startup and learning-session isolation
        timeout-minutes: 3
        run: |
          node --test packages/cli/test/startup-recovery.test.mjs
          node tools/cli-session-handoff-test.mjs
          node --import tsx tools/learn-recovery-probe-test.mjs
          node --import tsx tools/login-session-readiness-test.mjs
      - name: Check SDK runtime
        timeout-minutes: 6
        run: pnpm --filter @onethu/sdk exec node --import tsx --test --test-timeout=60000 test/*.test.*
      - name: Check Windows WebView threading
        run: node tools/windows-webview-threading-test.mjs
      - name: Check desktop window ownership
        run: node tools/desktop-lifecycle-policy-test.mjs
      - name: Check background keep-alive carriers
        run: node --import ./tools/ts-resolve-register.mjs tools/desktop-keepalive-test.mjs
      - name: Check fork build isolation
        run: node tools/fork-build-test.mjs
      - name: Check release manifest
        run: node tools/release-manifest-test.mjs
      - name: Check cloud account boundaries
        run: node tools/seafile-account-lifecycle-test.mjs
      - name: Check authentication recovery and account ownership
        # 走 package.json 的 test:login 而不是在这里铺多行命令：一条命令只有一退出码，
        # 各平台语义一致，本地也能用同一条脚本复现（`pnpm run test:login`）。
        run: pnpm run test:login
      - name: Check profile merge boundaries
        run: node --import ./tools/ts-resolve-register.mjs tools/profile-sync-test.mjs
      - name: Check secondary timetable and calendar integrity
        run: |
          node tools/secondary-schedule-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/secondary-anchor-test.mjs
          node tools/system-calendar-state-test.mjs
      - name: Check learning sessions and portable wallpaper archives
        run: |
          node --import ./tools/ts-resolve-register.mjs tools/http-wengine-bootstrap-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/learn-response-recovery-test.mjs
          node tools/wallpaper-sync-test.mjs
          node tools/personal-cloud-target-state-test.mjs
      - name: Check update reminders and news language
        run: |
          node tools/hotfix-update-test.mjs
          node tools/update-reminder-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/update-language-test.mjs
          node tools/update-check-lifecycle-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/update-version-order-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/news-language-test.mjs
      - name: Check mobile interaction state
        run: |
          node --import ./tools/ts-resolve-register.mjs tools/mobile-layout-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/preview-data-isolation-test.mjs
          node tools/update-check-lifecycle-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/board-undo-test.mjs
          node --import ./tools/ts-resolve-register.mjs tools/vault-docking-test.mjs
      # sidecar 必须在目标平台现场构建（仓库不带任何架构的二进制；
      # 旧版 Windows 安装包曾打进 mac 的 Mach-O → 插件宿主拉起必死）
      - name: Build harness sidecar (host-native)
        run: pnpm --filter @onethu/desktop build:harness
      - name: Build desktop bundles
        # 分叉包走 scripts/build-fork.mjs（换打包标识与版本、更新源指向本 fork、产物自校验，
        # 并自行加 --bundles nsis）；不分叉时沿用原来的 tauri build 与 Windows NSIS 选择。
        run: ${{ inputs.fork && 'node apps/desktop/scripts/build-fork.mjs' || 'pnpm --filter @onethu/desktop exec tauri build' }} ${{ matrix.args }} ${{ !inputs.fork && runner.os == 'Windows' && !inputs.no_bundle && '--bundles nsis' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.no_bundle) && '--no-bundle' || '' }}
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          TAURI_SIGNING_PRIVATE_KEY: ""
          TRACE_AMAP_KEY: ${{ secrets.TRACE_AMAP_KEY }}
          # 版本覆盖（可选）：build-fork.mjs 用它替换分叉配置里的 version，并注入前端
          ONETHU_FORK_VERSION: ${{ inputs.version }}
      - name: Verify bundled resident runtime
        timeout-minutes: 2
        run: node tools/bundled-cli-startup-test.mjs
      - name: Record frozen source
        run: node -e "const fs=require('node:fs'),cp=require('node:child_process');fs.writeFileSync('release-source.json',JSON.stringify({source:cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),version:require('./apps/desktop/package.json').version})+'\n')"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onethu-${{ matrix.os }}${{ inputs.fork && '-fork' || '' }}
          path: |
            release-source.json
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/onethu.exe
            apps/desktop/src-tauri/target/release/OneTHU-Fork.exe
            apps/desktop/src-tauri/target/**/*.dmg

  android:
    # 分叉包的 Android 产物：applicationId 换成 app.onethu.desktop.fork，与正式版并存、
    # 互不覆盖（同包名换签名会 INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
    # 打包链路在 apps/desktop/scripts/build-fork-apk.sh：Linux runner 上从零生成工程，
    # 不复用 build-release-apk.sh 那套 exFAT 内盘搬迁逻辑（CI 上没有那个问题）。
    # 签名材料由 secret 落盘到临时目录；**没配 secret 时只出未签名包**（文件名带
    # -unsigned），用于验证构建链，不会被误当成可发布产物。
    if: github.event_name == 'workflow_dispatch' && inputs.android
    needs: guard
    runs-on: ubuntu-latest
    env:
      # NDK 只提供 clang/sysroot（rquickjs 的 bindgen 与链接器要用），AGP 不校验具体版本
      # （生成的工程没有 ndkVersion）。换版本只改这一行，脚本按 NDK_HOME 自行推导工具链路径。
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # 语法错要在下载 SDK/NDK 之前就炸，别等十分钟
      - name: Check shell syntax
        run: bash -n apps/desktop/scripts/build-fork-apk.sh
      # 图标由 ffmpeg 按各密度渲染（tools/android-icons.py）：缺了它，包里会退回模板默认图
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # 生成的工程是 AGP 8.11 + Gradle 8.14.3：JDK 17 是 AGP 8.x 的下限
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # 默认值 `tools platform-tools` 里的 `tools` 已从 SDK 仓库移除：sdkmanager 报
          # `Warning: Failed to find package 'tools'` 后退出 1，step 直接失败（实测 run
          # 39962500491）。留空，由下一步用显式包名安装。
          packages: ""
      - name: Install SDK packages and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;$NDK_VERSION"
          ls -1 "$ANDROID_HOME/ndk"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            plugins/OneTHU-Harness
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Build workspace libraries
        run: pnpm --filter @onethu/info-lib build
      - name: Check fork build isolation
        run: node tools/fork-build-test.mjs
      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::仓库未配置 ANDROID_KEYSTORE_BASE64：本次只产出未签名 APK（仅验证构建链）"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/onethu-release.keystore"
          chmod 600 "$RUNNER_TEMP/onethu-release.keystore"
          echo "ONETHU_KEYSTORE=$RUNNER_TEMP/onethu-release.keystore" >> "$GITHUB_ENV"
      - name: Build fork APK
        env:
          ONETHU_APK_OUT: ${{ runner.temp }}/apk
          ONETHU_FORK_VERSION: ${{ inputs.version }}
          ONETHU_KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          ONETHU_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          ONETHU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: bash apps/desktop/scripts/build-fork-apk.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: onethu-android-fork
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error

  publish:
    # 手动发版：三端产物 + latest.json 一起发。tag 用 `fork-<version>`，**不用 v***（会与上游
    # 将来的同名 tag 撞车，也会让人误以为是官方发布）。清单的消费方是客户端
    # `lib/updater.ts`：`releases/latest/download/latest.json`，因此这个 Release 必须是
    # 最新的正式发布（不能是 draft 或 prerelease）。
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [guard, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: onethu-*-fork
          path: release-artifacts
      - name: Build latest.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node apps/desktop/scripts/make-release-manifest.mjs \
            --dir release-artifacts \
            --version "$VERSION" \
            --out release-out/latest.json \
            --releasedAt "$(date -u +%F)" \
            --notes "基于上游的分叉构建 $VERSION。后台常驻可选悬浮球或托盘；网关会话仍在线时自动重置并重试一次登录入口。"
      - name: Write release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-out
          {
            echo "# OneTHU-Fork $VERSION"
            echo
            echo "本仓是 smartThise/OneTHU 的分叉，这是分叉自己的构建，不是官方发布。"
            echo "打包标识 app.onethu.desktop.fork，可与官方版并存安装；更新源指向本仓库。"
            echo
            echo "| 平台 | 文件 |"
            echo "| --- | --- |"
            for f in "$(find release-artifacts -name '*-setup.exe' | head -1)" \
                     "$(find release-artifacts -name '*.dmg' | head -1)" \
                     "$(find release-artifacts -name '*.apk' | head -1)"; do
              [ -n "$f" ] && echo "| — | \`$(basename "$f")\` |"
            done
            echo
            echo "\`latest.json\` 是按平台的更新清单（含大小与 SHA-256），客户端下载后流式校验。"
          } > release-out/NOTES.md
      - name: Publish release
        env:
          # 分叉仓库的 GITHUB_TOKEN 只读，建 Release 用 PAT（见 guard 的写权限校验）
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 只发三端安装包与清单；便携 exe（onethu.exe）不进 Release
          mapfile -t FILES < <(find release-artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.apk' \) | grep -v '/onethu\.exe$')
          printf '%s\n' "${FILES[@]}"
          gh release create "fork-$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OneTHU-Fork $VERSION" \
            --notes-file release-out/NOTES.md \
            "${FILES[@]}" release-out/latest.json
      - name: Verify manifest resolves
        env:
          # 分叉仓库的 GITHUB_TOKEN 只读，建 Release 用 PAT（见 guard 的写权限校验）
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 客户端读的就是 releases/latest/download/latest.json：能在这一步失败，比等用户发现好。
          # 刚建完 Release 时 latest 可能还指向上一个版本，所以重试几次再判失败。
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" -o /tmp/latest.json && grep -q "\"$VERSION\"" /tmp/latest.json; then
              break
            fi
            echo "· 第 $attempt 次未取到 $VERSION 的清单，5 秒后重试"
            sleep 5
          done
          node -e '
            const m = JSON.parse(require("node:fs").readFileSync("/tmp/latest.json", "utf8"));
            const keys = ["windows", "macos", "android"];
            for (const k of keys) {
              if (!m.assets?.[k]?.url) { console.error(`✗ 清单缺少 ${k} 资产`); process.exit(1); }
            }
            if (m.version !== process.argv[1]) { console.error(`✗ 清单版本 ${m.version} 与输入 ${process.argv[1]} 不一致`); process.exit(1); }
            console.log(`✓ 清单可解析：${m.version}（${keys.map((k) => m.assets[k].url).join(", ")}）`);
          ' "$VERSION"
